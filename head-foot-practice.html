<html>
    <head>
        <title>Practice</title>

    </head>
    <body>
        <h1>IPL Ticket booking App</h1>
        <ul>
            <li><a href=#book>Book your tickets</li>
            <li><a href=#status>Check your booking status</li>
            <li><a href=#cancel>Cancel your booking</li>
        </ul>
        <section id="book">
            <h2>Book your tickets</h2>
            <p>Fill the below details</p>
            <form>
                <label for="name">Name: </label>
                <input type="text" id="name" name="name">
                <br><br>
                <label for="email">Email: </label>
                <input type="email" id="email" name="email">
                <br><br>
                <label for="mobile">Mobile: </label>
                <input type="tel" id="mobile" pattern="[0-9]{10} maxlength=10">
                <br><br>    
                <button type="submit">Submit</button>               
            </form>
        </section>     
<section id="status">
            <h2>Check status of tickets</h2>
            <p>Fill the below details</p>
            <form>
                <label for="ticket">Ticket No </label>
                <input type="number" id="tiket" name="ticket">
                <br><br>
                <button type="submit">Submit</button>               
            </form>
        </section>             
    </body>
</html>
